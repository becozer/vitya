<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИКТОР ХОХОЛКОВ | 13-14.11.26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Шрифты: Unbounded для заголовков, Space Grotesk для текста -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ПЕРВЫЙ ЭКРАН (HERO) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            overflow: hidden;
            padding: 0 3vw;
        }

        .hero-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            will-change: transform, opacity, filter;
            transition: transform 0.1s linear, opacity 0.1s linear, filter 0.1s linear;
        }

        .name-part {
            font-family: 'Unbounded', sans-serif;
            font-size: 13vw;
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -2px;
            
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.7);
            color: transparent;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: default;
            white-space: nowrap;
        }

        .name-part.first {
            align-self: flex-start;
            margin-left: -1vw;
        }

        .name-part.last {
            align-self: flex-end;
            margin-right: -1vw;
            margin-top: -2vw;
        }

        .hero-content:hover .name-part {
            -webkit-text-stroke: 2px #ffffff;
            color: #ffffff;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
        }

        .date-block {
            margin-top: 40px;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 500;
            letter-spacing: 20px;
            text-transform: uppercase;
            color: #888;
            margin-left: 20px;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .scroll-line {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .scroll-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: #fff;
            animation: scrollDown 2s infinite cubic-bezier(0.77, 0, 0.175, 1);
        }

        @keyframes scrollDown {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400%); }
        }

        /* --- ГАЛЕРЕЯ --- */
        .gallery {
            position: relative;
            z-index: 2;
            padding-bottom: 100px;
        }

        .photo-item {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3vh 3vw;
            position: relative;
            overflow: hidden;
        }

        .photo-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1600px;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background-color: #111;
            
            transform: scale(0.85);
            opacity: 0;
            filter: blur(10px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .photo-item.visible .photo-wrapper {
            transform: scale(1);
            opacity: 1;
            filter: blur(0);
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1.5s ease;
        }

        .photo-item:hover .photo-wrapper img {
            transform: scale(1.03);
        }

        .photo-number {
            position: absolute;
            top: 20px;
            right: 30px;
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            z-index: 3;
            mix-blend-mode: overlay;
            letter-spacing: 2px;
        }

        /* --- ФУТЕР (КНОПКА) --- */
        .footer {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: #050505;
            position: relative;
        }

        .footer h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(2rem, 6vw, 5rem);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 60px;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
            color: transparent;
        }

        .btn {
            display: inline-block;
            padding: 25px 80px;
            background: transparent;
            color: #fff;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: -1;
        }

        .btn:hover {
            color: #000;
            border-color: #fff;
        }

        .btn:hover::before {
            transform: scaleY(1);
        }

        @media (max-width: 768px) {
            .name-part { font-size: 15vw; }
            .date-block { letter-spacing: 10px; margin-left: 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Первый экран -->
    <section class="hero">
        <div class="hero-content">
            <div class="name-part first">Виктор</div>
            <div class="name-part last">Хохолков</div>
            <div class="date-block">13 — 14 / 11 / 26</div>
        </div>
        <div class="scroll-line"></div>
    </section>

    <!-- Бесконечная галерея -->
    <section class="gallery">
        
        <!-- ФОТО 1 -->
        <div class="photo-item">
            <div class="photo-wrapper">
                <span class="photo-number">01</span>
                <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1600" alt="Фото 1" loading="lazy">
            </div>
        </div>

        <!-- ФОТО 2 -->
        <div class="photo-item">
            <div class="photo-wrapper">
                <span class="photo-number">02</span>
                <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=1600" alt="Фото 2" loading="lazy">
            </div>
        </div>

        <!-- ФОТО 3 -->
        <div class="photo-item">
            <div class="photo-wrapper">
                <span class="photo-number">03</span>
                <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80&w=1600" alt="Фото 3" loading="lazy">
            </div>
        </div>

        <!-- ФОТО 4 -->
        <div class="photo-item">
            <div class="photo-wrapper">
                <span class="photo-number">04</span>
                <img src="https://images.unsplash.com/photo-1505236858219-8359eb29e329?q=80&w=1600" alt="Фото 4" loading="lazy">
            </div>
        </div>
        
        <!-- Добавляй остальные фото по аналогии: копируй блок <div class="photo-item">...</div> и меняй номер и ссылку в src -->

    </section>

    <!-- Финальный экран -->
    <section class="footer">
        <h2>Все моменты здесь</h2>
        <!-- Твоя ссылка на Яндекс.Диск -->
        <a href="https://disk.yandex.ru/d/K-Npo42wlsG0SQ" class="btn" target="_blank">Яндекс.Диск</a>
    </section>

    <!-- Скрипты для анимаций -->
    <script>
        // 1. Анимация появления фото при скролле
        const items = document.querySelectorAll('.photo-item');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                } else {
                    entry.target.classList.remove('visible');
                }
            });
        }, {
            threshold: 0.2 
        });

        items.forEach(item => {
            observer.observe(item);
        });

        // 2. Параллакс для заголовка
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const heroContent = document.querySelector('.hero-content');
            
            if (scrollY < window.innerHeight) {
                heroContent.style.transform = `translateY(${scrollY * 0.4}px) scale(${1 + scrollY * 0.0005})`;
                heroContent.style.opacity = 1 - (scrollY / (window.innerHeight * 0.6));
                heroContent.style.filter = `blur(${scrollY * 0.02}px)`;
            }
        });
    </script>
</body>
</html>
