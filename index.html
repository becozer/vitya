<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше мероприятие</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        header p {
            margin-top: 10px;
            font-size: 1.2em;
            color: #bdc3c7;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.02);
        }
        .btn {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 40px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #c0392b;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Фотоотчет: [Название мероприятия]</h1>
        <p>Тут только избранные кадры. Остальное — по кнопке ниже.</p>
    </header>

    <div class="container">
        <!-- Галерея -->
        <div class="gallery">
            <!-- Замени ссылки внутри src на свои. Если загружаешь фото на GitHub, просто положи их рядом с файлом index.html и напиши src="photo1.jpg" -->
            <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=800" alt="Фото 1">
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=800" alt="Фото 2">
            <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80&w=800" alt="Фото 3">
            <img src="https://images.unsplash.com/photo-1505236858219-8359eb29e329?q=80&w=800" alt="Фото 4">
        </div>

        <!-- Кнопка на Яндекс.Диск -->
        <a href="ССЫЛКА_НА_ТВОЙ_ЯНДЕКС_ДИСК" class="btn" target="_blank">Смотреть ВСЕ фото на Яндекс.Диске</a>
    </div>

    <footer>
        Сделано с любовью для друзей.
    </footer>

</body>
</html>
